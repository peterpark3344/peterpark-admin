<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>푸꾸옥 가이드 수익 및 행사 관리</title>
    <!-- OCR(문자 인식)을 위한 Tesseract.js 라이브러리 추가 -->
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f8f9fa; color: #333; margin: 0; padding: 15px; line-height: 1.5; }
        h2 { color: #2c3e50; text-align: center; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .section-box { background: #fff; border-radius: 8px; padding: 15px; margin-bottom: 15px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        h3 { font-size: 16px; color: #2980b9; margin-top: 0; border-left: 4px solid #3498db; padding-left: 8px; }
        label { display: block; font-weight: bold; margin-bottom: 5px; font-size: 14px; }
        input[type="text"], input[type="date"], textarea { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 10px; font-size: 14px; }
        textarea { height: 120px; resize: vertical; }
        table { width: 100%; border-collapse: collapse; margin-bottom: 10px; font-size: 13px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: center; }
        th { background-color: #f1f8ff; }
        .btn { display: inline-block; background-color: #3498db; color: white; padding: 10px 15px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; text-align: center; width: 100%; margin-bottom: 5px; font-size: 14px; }
        .btn:hover { background-color: #2980b9; }
        .btn-green { background-color: #2ecc71; }
        .btn-green:hover { background-color: #27ae60; }
        .loading { font-size: 13px; color: #e67e22; text-align: center; font-weight: bold; margin-bottom: 5px; display: none; }
    </style>
</head>
<body>

    <h2>🌴 푸꾸옥 가이드 수익 및 행사 관리</h2>

    <!-- 0. 기본 행사 정보 설정 -->
    <div class="section-box">
        <h3>0. 기본 행사 정보 설정</h3>
        <label>투어 코드</label>
        <input type="text" id="tourCode" value="BVE904ZE5W">
        <label>행사 기간</label>
        <div style="display: flex; gap: 5px;">
            <input type="date" id="startDate" value="2026-09-17">
            <span style="align-self: center;">~</span>
            <input type="date" id="endDate" value="2026-09-20">
        </div>
    </div>

    <!-- 1. 행사지시서 사진 촬영 및 AI 인식 -->
    <div class="section-box">
        <h3>1. 행사지시서 사진 촬영 / 업로드</h3>
        <input type="file" id="orderCamera" accept="image/*" capture="environment" style="display:none;" onchange="processOCR(this, 'orderText', 'orderLoading')">
        <button class="btn" onclick="document.getElementById('orderCamera').click()">📸 행사지시서 카메라로 찍기 / 갤러리 선택</button>
        <div id="orderLoading" class="loading">🔄 사진에서 글자를 읽어오는 중입니다... 잠시만 기다려주세요!</div>
        
        <label>📋 행사지시서 내용 (자동 입력 또는 직접 수정)</label>
        <textarea id="orderText">투어 코드: BVE904ZE5W 일정: 2026-09-17 ~ 2026-09-20 (3박 4일) 가이드: KO: 박재우 / VN: Thiện (-0378461735) 인원: ADT 5명, CHD 5명 (총 10명) FLIGHT IN: ZE981 22:25 / FLIGHT OUT: ZE982, 23:25 호텔 정보: - NOVOTEL (김용석 Superior Twin * 3) - 1090791 - BEST WESTERN (정진선 DELUXE TWN * 1) - 643000 정산 조건: 메꾸기 1인 $80(5+5chd) / 회사 5:5 정산 조건 / 옵션가능 / 쇼핑 3회 기가팁 금액: $50 × 10명 = $500</textarea>
    </div>

    <!-- 2. 고객 명단 서류 촬영 및 AI 인식 -->
    <div class="section-box">
        <h3>2. 고객 명단 서류 촬영 / 업로드</h3>
        <input type="file" id="clientCamera" accept="image/*" capture="environment" style="display:none;" onchange="processOCR(this, 'clientTextOutput', 'clientLoading')">
        <button class="btn" onclick="document.getElementById('clientCamera').click()">📸 고객 명단/서류 카메라로 찍기 / 갤러리 선택</button>
        <div id="clientLoading" class="loading">🔄 명단 사진을 분석하여 글자를 추출하고 있습니다...</div>

        <label>👥 고객 명단 및 요청사항 관리</label>
        <table>
            <thead>
                <tr>
                    <th>고객 성함</th>
                    <th>생년월일</th>
                    <th>예약번호</th>
                    <th>요청사항</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>KIM/YONGSEOK<br>김용석</td>
                    <td>1976-01-01</td>
                    <td>1090791</td>
                    <td>NOVOTEL Superior Twin</td>
                </tr>
                <tr>
                    <td>JUNG/JINSEON<br>정진선</td>
                    <td>1980-01-01</td>
                    <td>643000</td>
                    <td>BEST WESTERN DELUXE TWN</td>
                </tr>
            </tbody>
        </table>
        <!-- AI가 읽어온 원문이 임시로 들어오는 공간 -->
        <textarea id="clientTextOutput" style="display:none;"></textarea>
        
        <button class="btn btn-green" onclick="saveData()">💾 수정 사항 저장 및 반영하기</button>
    </div>

    <script>
        // 스마트폰 카메라/갤러리 사진 인식 (OCR) 실행 함수
        function processOCR(input, targetTextareaId, loadingId) {
            if (input.files && input.files[0]) {
                const file = input.files[0];
                const loadingEl = document.getElementById(loadingId);
                const targetEl = document.getElementById(targetTextareaId);

                loadingEl.style.display = "block";

                // Tesseract.js를 이용해 이미지 내 텍스트 추출 (한국어 + 영어 지원)
                Tesseract.recognize(
                    file,
                    'kor+eng',
                    { 
                        logger: m => console.log(m) // 진행 상황 콘솔 출력
                    }
                ).then(({ data: { text } }) => {
                    loadingEl.style.display = "none";
                    if (text && text.trim() !== "") {
                        targetEl.value = "--- [카메라 인식 데이터] ---\n" + text.trim();
                        alert("✨ 사진 속 글자 인식이 완료되었습니다!\n내용을 확인하고 저장해 주세요.");
                    } else {
                        alert("⚠️ 사진에서 인식된 글자가 없습니다. 다시 선명하게 촬영해 주세요.");
                    }
                }).catch(err => {
                    loadingEl.style.display = "none";
                    console.error(err);
                    alert("❌ 글자 인식 중 오류가 발생했습니다. 다시 시도해 주세요.");
                });
            }
        }

        function saveData() {
            alert("💾 수정 사항이 성공적으로 저장 및 반영되었습니다!");
        }
    </script>
</body>
</html>
